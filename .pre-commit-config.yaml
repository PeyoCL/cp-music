repos:
  # ---------------------------------------------------------------------------
  # Built-in pre-commit hooks: whitespace, file hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of file (ensure newline)
      - id: check-yaml
        name: Validate YAML files
      - id: check-toml
        name: Validate TOML files (pyproject.toml)
      - id: check-added-large-files
        name: Block large file commits
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
        name: Detect unresolved merge conflicts
      - id: detect-private-key
        name: Detect accidentally committed private keys
      - id: check-case-conflict
        name: Check for case-sensitive filename conflicts
      - id: debug-statements
        name: Detect leftover debug/print statements (pdb, breakpoint)

  # ---------------------------------------------------------------------------
  # Ruff — linter and formatter (replaces black + isort + flake8)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        name: Ruff — lint and autofix
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format
        name: Ruff — format code

  # ---------------------------------------------------------------------------
  # Security: bandit — static security analysis for Python
  # ---------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        name: Bandit — static security analysis
        args: ["-c", "pyproject.toml", "--severity-level", "medium"]
        exclude: ^tests/

  # ---------------------------------------------------------------------------
  # pip-audit — dependency vulnerability scanner (OSV/PyPI Advisory Database)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.0
    hooks:
      - id: pip-audit
        name: pip-audit — check dependency CVEs
        args: ["--require-hashes=false"]
