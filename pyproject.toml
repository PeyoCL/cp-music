[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cp-music"
version = "0.2.0"
description = "Bidirectional playlist migration between Spotify and YouTube Music"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "spotipy>=2.23.0",
    "ytmusicapi>=1.7.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
# Primary entry-point (kept for backward compatibility)
cpmusic = "cpmusic.cli:main"
# Alias more descriptive of the tool's full scope
cp-music = "cpmusic.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "pytest-asyncio>=0.23.0",
]

# ---------------------------------------------------------------------------
# uv-managed dev dependencies
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "pytest-asyncio>=0.23.0",
    "bandit>=1.7.0",
    "pre-commit>=3.7.0",
]

# ---------------------------------------------------------------------------
# Ruff linter / formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
# Bandit — security SAST
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = [
    # B101: assert statements are fine in tests (already excluded above)
    "B101",
]
# Severity/confidence thresholds: only fail on MEDIUM+ severity, MEDIUM+ confidence
tests = []

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
